<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ゲームの目的</title>
  <style>
    :root{--ink:#261b14;--red:#ad241b;--gold:#a77c34;--paper:#efe0ba}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0a0604;color:var(--ink);font-family:"Yu Mincho","Hiragino Mincho ProN","Yu Gothic",serif}
    body{display:grid;place-items:center;padding:18px}
    .sheet{width:min(1080px,100%);background:radial-gradient(circle at 45% 35%,#f8edcf,#ead9b1 65%,#dac294);border:6px double #8c672d;box-shadow:0 18px 60px #000c;padding:28px 34px 24px;position:relative}
    .sheet:before{content:"";position:absolute;inset:8px;border:1px solid #9a7436;pointer-events:none}
    h1{text-align:center;margin:0 0 4px;color:var(--red);font-size:clamp(31px,5vw,58px);letter-spacing:.06em}
    .lead{text-align:center;font-weight:800;line-height:1.7;margin:0 0 24px;font-family:"Yu Gothic",sans-serif}
    .grid{display:grid;grid-template-columns:1.08fr .92fr;gap:28px;align-items:center}
    .rules{display:grid;gap:18px}.rule{display:grid;grid-template-columns:76px 1fr;gap:15px;align-items:center}.icon{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:#16100d;color:#f4d586;border:3px solid #9d7535;font-size:34px;font-weight:1000;box-shadow:inset 0 0 0 2px #2d2119}.rule h2{margin:0 0 4px;font-size:24px}.rule p{margin:0;line-height:1.65;font-family:"Yu Gothic",sans-serif;font-weight:600}.preview{width:100%;border:5px solid #5c4024;box-shadow:0 8px 18px #0006}.footer{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:24px}.small{font:13px/1.5 "Yu Gothic",sans-serif;color:#5d4a35}.next{min-width:250px;padding:13px 26px;border:2px solid #42110d;background:linear-gradient(#d24b36,#9f281f);color:#fff1ce;font-weight:1000;font-size:23px;box-shadow:inset -4px -4px #561711,inset 4px 4px #ef7b67;cursor:pointer}
    @media(max-width:760px){body{padding:8px}.sheet{padding:18px 16px}.grid{grid-template-columns:1fr}.preview{max-height:260px;object-fit:cover}.rule{grid-template-columns:58px 1fr}.icon{width:54px;height:54px;font-size:26px}.rule h2{font-size:20px}.footer{flex-direction:column}.next{width:100%}}
  </style>
</head>
<body>
  <main class="sheet">
    <h1>前へ出ろ。士気を上げろ。</h1>
    <p class="lead">あなたは柴田勝家。敵陣へ踏み込み、敵を斬るほど士気が高まる。</p>
    <div class="grid">
      <section class="rules">
        <article class="rule"><div class="icon">斬</div><div><h2>敵を斬る</h2><p>敵に近づいてSPACEで攻撃。第一陣は100人討取が目標。</p></div></article>
        <article class="rule"><div class="icon">喝</div><div><h2>かかれ柴田！</h2><p>士気100になるとゲージは減らない。同じSPACEで360度薙ぎ払い＋味方兵突撃が発動。</p></div></article>
        <article class="rule"><div class="icon">瓶</div><div><h2>瓶割柴田（第二陣以降）</h2><p>戦場に現れる水瓶は通常攻撃で破壊。回復を捨て、攻撃力を高める。</p></div></article>
      </section>
      <img class="preview" src="assets/stage1_preview.png" alt="第一陣の戦闘画面">
    </div>
    <div class="footer"><div class="small">※スマホではコンフィグを飛ばし、そのまま第一陣へ進みます。</div><button id="nextBtn" class="next">陣立へ</button></div>
  </main>
  <script src="../shared/nav.js"></script>
  <script>
    const mobile=matchMedia('(max-width:880px)').matches||matchMedia('(pointer:coarse)').matches;
    const btn=document.getElementById('nextBtn');
    btn.textContent=mobile?'第一陣へ':'陣立へ';
    btn.onclick=()=> mobile ? KAKARE_NAV.go('stage1','../stages/stage1/index.html') : KAKARE_NAV.go('config','../config/index.html');
  </script>
</body>
</html>
