<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>かかれ柴田！</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#060303;color:#f5e3bc;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
    body{display:grid;place-items:center;padding:16px}
    .wrap{position:relative;width:min(1100px,100%);aspect-ratio:753/479;background:#000;box-shadow:0 24px 70px #000}
    .wrap img{width:100%;height:100%;display:block;object-fit:contain}
    .hit{position:absolute;border:0;background:transparent;cursor:pointer}
    .hit:focus-visible{outline:4px solid #fff0a6;outline-offset:-4px}
    .start{left:56%;top:51%;width:28%;height:12%}
    .how{left:56%;top:68%;width:28%;height:10%}
    .note{position:fixed;bottom:8px;left:0;right:0;text-align:center;font:12px/1.4 system-ui,sans-serif;color:#8e7b63;pointer-events:none}
    @media(max-width:700px){body{padding:0}.wrap{width:100%;aspect-ratio:753/479}.note{display:none}}
  </style>
</head>
<body>
  <div class="wrap">
    <img src="assets/title_screen.png" alt="かかれ柴田！ 鬼柴田戦記">
    <button id="startBtn" class="hit start" aria-label="出陣"></button>
    <button id="howBtn" class="hit how" aria-label="遊び方"></button>
  </div>
  <div class="note">出陣 / 遊び方のどちらからでもチュートリアルへ進みます。</div>
  <script src="../shared/nav.js"></script>
  <script>
    const next=()=>KAKARE_NAV.go('tutorial','../tutorial/index.html');
    document.getElementById('startBtn').onclick=next;
    document.getElementById('howBtn').onclick=next;
  </script>
</body>
</html>
